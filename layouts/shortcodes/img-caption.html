{{- with .Get "href" }}<a href="{{ . }}">{{ end -}}
<figure class="fig">
  <img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}" loading="lazy"{{ with .Get "width" }} style="max-width:{{ . }}{{ if findRE `^\d+$` . }}px{{ end }}"{{ end }}>
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{- if .Get "href" }}</a>{{ end -}}
