<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="Elseyworks home">
      <span class="brand-mark">Elsey<em>works</em></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{- $cur := . -}}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <a href="/search/" class="nav-search"{{ if eq .RelPermalink "/search/" }} aria-current="page"{{ end }}>Search</a>
    </nav>
  </div>
</header>
