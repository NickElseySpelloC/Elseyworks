<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="Elseyworks home">
      <span class="brand-mark">Elsey<em>works</em></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{- $cur := . -}}
      {{- range site.Menus.main }}
      {{- if ne .Name "About" }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      {{- end }}
      <a href="/about/"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>About Lynn</a>
      <form class="nav-search" role="search" action="/search/" method="get">
        <label class="visually-hidden" for="nav-q">Search the articles</label>
        <input id="nav-q" name="q" type="search" placeholder="Search" autocomplete="off">
        <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      </form>
    </nav>
  </div>
</header>
